[supervisord]
nodaemon=true

[program:Xvfb]
command=/usr/bin/Xvfb :0 -screen 0 1280x1024x16
autostart=true
autorestart=true

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":0"
autostart=true
autorestart=true

[program:x11vnc]
command=/usr/bin/x11vnc -display :0 -forever -usepw -shared
autostart=true
autorestart=true

[program:firefox]
command=/usr/bin/firefox
environment=DISPLAY=":0"
autostart=true
autorestart=true
